# ─── Canonical stack ─────────────────────────────────────────────────────────
# The full self-hosted stack, migrations included: the api runs them at startup
# under a Postgres advisory lock (#46), so `docker compose up` is enough.
#
#   dev:  docker compose up            (auto-loads compose.override.yml)
#   prod: docker compose -f compose.yml --profile prod up -d
#
# The explicit `-f compose.yml` on the prod path bypasses the dev override
# file. Nginx is frontend here and only materializes under `--profile prod`;
# api replica scaling belongs to scripts/prod.sh (`--scale api=…`), the one
# place prod specifics live. env fallbacks below mirror the zod defaults in
# packages/api/src/config/index.ts — keep them in sync when either changes.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kyro-net

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_DIR=/app/uploads
      - OLLAMA_URL=${OLLAMA_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - CHAT_MODEL=${CHAT_MODEL:-llama3.2}
      - RERANK_ENABLED=${RERANK_ENABLED:-false}
      - RERANK_MODEL=${RERANK_MODEL:-llama3.2}
      - VECTOR_DISTANCE_THRESHOLD=${VECTOR_DISTANCE_THRESHOLD:-0.5}
      - STORAGE_LIMIT=${STORAGE_LIMIT:-10737418240}
      - ALLOW_SIGNUP=${ALLOW_SIGNUP:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - kyro-net

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_URL=http://api:3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - kyro-net

  # prod-specific: reverse proxy on :80. Profile keeps it out of dev and
  # out of a bare `up`; prod scripts pass --profile prod.
  nginx:
    image: nginx:alpine
    container_name: kyro-nginx
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - kyro-net

volumes:
  pg_data:
  uploads_data:

networks:
  kyro-net:
    driver: bridge
