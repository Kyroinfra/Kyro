# ─── Dev overrides ───────────────────────────────────────────────────────────
# Auto-loaded by plain `docker compose ...` beside compose.yml — a flagless
# `docker compose up` IS the dev stack. Prod must bypass this file by running
# with an explicit compose file (`docker compose -f compose.yml ...`, see
# scripts/prod.sh): nothing here belongs in prod — hot-reload builds, source
# bind mounts, published ports, ollama, pgadmin.
#
# Merge semantics: maps (environment/build) merge per key, lists (volumes)
# union by mount target — so the canonical api/web env blocks stand unless a
# specific key overrides here.
services:
  api:
    build:
      dockerfile: packages/api/Dockerfile.dev
    command: pnpm dev
    environment:
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - ./packages/shared:/app/packages/shared
    ports:
      - "3000:3000"
    depends_on:
      ollama:
        condition: service_healthy

  # Containerized Ollama for the dev stack. Bind-mounts the host's existing
  # model store read-only, so downloaded models are reused, never re-downloaded,
  # and the host `ollama serve` config stays untouched (still binds 127.0.0.1).
  # Blobs are content-addressed and immutable at inference time — sharing the
  # store read-only between the host daemon and this container is safe, and
  # models pulled via the host CLI appear here immediately.
  # No ports published: reachable only from inside the compose network.
  ollama:
    image: ollama/ollama:latest
    volumes:
      # Override via .env for installs that store models elsewhere
      # (e.g. user-installed Ollama uses ~/.ollama/models).
      - ${OLLAMA_MODELS_DIR:-/usr/share/ollama/.ollama/models}:/root/.ollama/models:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama ls >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - kyro-net

  web:
    build:
      dockerfile: packages/web/Dockerfile.dev
    environment:
      NODE_ENV: development
    volumes:
      - ./packages/web/src:/app/packages/web/src
      - ./packages/web/static:/app/packages/web/static
      - ./packages/shared:/app/packages/shared
    ports:
      - "3001:3001"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kyro-net

volumes:
  pgadmin_data:
