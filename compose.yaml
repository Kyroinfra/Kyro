services:
  nginx:
    image: nginx:alpine
    container_name: kyro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - kyro-net

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    # No ports exposed — all traffic goes through NGINX
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://kyro:secret@postgres:5432/kyro
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - kyro-net

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kyro
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kyro
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyro -d kyro"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kyro-net

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kyro-net

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kyro-net

volumes:
  pg_data:
  redis_data:

networks:
  kyro-net:
    driver: bridge
