services:
  # Expose infra ports locally so you can connect with DB clients / Redis tools
  # postgres:
  #   ports:
  #     - "5432:5432"
  #
  # redis:
  #   ports:
  #     - "6379:6379"

  # Run migrations once on startup, then exit — same as prod but lighter
  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    command: node dist/db/migrate.js
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=dev-secret
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - kyro-net

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    # No replicas in dev — single instance, easier to read logs
    deploy:
      replicas: 1
    command: npx nodemon --watch src --ext ts,js --exec "node -r tsconfig-paths/register -r ts-node/register src/index.ts"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - UPLOAD_DIR=/app/uploads
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - CHAT_MODEL=${CHAT_MODEL:-llama3.2}
    volumes:
      - ./packages/api/src:/app/packages/api/src   # hot reload
      - ./packages/shared:/app/packages/shared       # shared types
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"   # direct access, no nginx in dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kyro-net

  worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    deploy:
      replicas: 1
    command: npx nodemon --watch src --ext ts,js --exec "node -r tsconfig-paths/register -r ts-node/register src/workers/textExtractor.ts"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - UPLOAD_DIR=/app/uploads
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
      - CHAT_MODEL=${CHAT_MODEL:-llama3.2}
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - ./packages/shared:/app/packages/shared
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kyro-net

  webhook-worker:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.dev
    command: npx nodemon --watch src --ext ts,js --exec "node -r tsconfig-paths/register -r ts-node/register src/workers/webhookDelivery.ts"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - ./packages/api/src:/app/packages/api/src
      - ./packages/shared:/app/packages/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kyro-net

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.dev
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - INTERNAL_API_URL=http://api:3000
      - PUBLIC_API_URL=http://localhost:3000
    volumes:
      - ./packages/web/src:/app/packages/web/src
      - ./packages/web/static:/app/packages/web/static
      - ./packages/shared:/app/packages/shared
    ports:
      - "3001:3001"   # Vite dev server, direct
    depends_on:
      - api
    networks:
      - kyro-net
