# ============================================================
# Kyro v2 — nginx/nginx.conf
# Changes are annotated inline with: # [CHANGE] reason
# ============================================================

events {
  worker_connections 1024;
}

http {
  # [CHANGE] Added log_format and access_log.
  # Without structured logging you're flying blind in production —
  # no visibility into slow requests, error rates, or abuse patterns.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  upstream kyro_api {
    least_conn;
    server api:3000;
    # NOTE: Docker Compose DNS resolves "api" to all replica IPs, so
    # least_conn load-balances across your 3 API containers automatically.
    # If you ever move to nginx Plus you can add health checks here too.
  }

  upstream kyro_web {
    server web:3001;
  }

  # [CHANGE] Rate-limit zone kept here but applied only to /api/v1 below.
  # Previously limit_req was on the server block, so it also throttled
  # the web frontend and static assets — not the intent.
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

  server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # [CHANGE] Added security headers.
    # These cost nothing and close a class of common browser-level attacks.
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # --- Web frontend ---
    location / {
      proxy_pass         http://kyro_web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   Origin            $http_origin;
      proxy_pass_request_headers on;
      proxy_connect_timeout 60s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }

    # --- API ---
    location /api/v1/ {
      # [CHANGE] Rate limiting moved here from the server block.
      # Only API traffic should be throttled; applying it globally
      # was also throttling the web app and static asset requests.
      limit_req zone=api_limit burst=200 nodelay;

      proxy_pass         http://kyro_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   Origin            $http_origin;
      proxy_pass_request_headers on;
      proxy_connect_timeout 60s;
      proxy_send_timeout    60s;

      # [CHANGE] proxy_read_timeout raised to 300s for API routes.
      # With client_max_body_size at 100M, a slow upload on the old
      # 60s timeout would be killed mid-transfer. 300s gives a
      # 100 MB upload ~2.7 Mbps minimum before timing out.
      proxy_read_timeout    300s;
    }

    # --- Internal health check endpoint ---
    location /health {
      # [CHANGE] Rate limiting explicitly excluded from /health.
      # Health probes from Docker and load balancers are high-frequency
      # and should never be throttled or they'll falsely fail.
      limit_req off;

      proxy_pass         http://kyro_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_set_header   Origin            $http_origin;

      # [CHANGE] Short, tight timeouts for health checks.
      # If the API can't respond to /health in 5 s it's genuinely unhealthy.
      # Using the 60s defaults here just delayed failure detection.
      proxy_connect_timeout 5s;
      proxy_send_timeout    5s;
      proxy_read_timeout    5s;
    }
  }
}
